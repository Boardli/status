owner: Boardli
repo: status

# Production endpoints probed every 5 minutes by GitHub Actions.
# /health is used for the API because it is the documented liveness endpoint and
# returns a minimal {"status":"ok"} to non-ELB callers (no internal state leaked).
sites:
  - name: Website
    url: https://boardli.ai
  - name: Application
    url: https://app.boardli.ai
  - name: API
    url: https://api.boardli.ai/health

status-website:
  # Served at https://boardli.github.io/status until DNS for status.boardli.ai
  # is in place; then replace `baseUrl` with `cname: status.boardli.ai`.
  baseUrl: /status
  name: Boardli
  introTitle: "**Boardli** system status"
  introMessage: >-
    Live availability and incident history for the Boardli website, application,
    and API. Checks run automatically every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Boardli
      href: https://boardli.ai
    - title: Sign in
      href: https://app.boardli.ai

# Incidents are GitHub Issues in this repository; new ones are assigned here.
assignees:
  - CohenChen1
